<div class="blog-page">
    
    <div class="page-header">
        <h1 class="page-title">BLOG</h1>
        <div class="header-line"></div>
    </div>

    <div class="social-section bio-curve">
        <div class="social-container">
            
            <div class="social-header">
                <div class="profile-info">
                    <i class="pi pi-instagram"></i>
                    <h2 class="profile-name">@waleskasilveirapsi</h2>
                </div>
                
                <a href="https://www.instagram.com/waleskasilveirapsi" target="_blank" class="btn-follow">
                    SEGUIR NO INSTAGRAM
                </a>
            </div>

            <div class="header-line white-line"></div>

            <div class="instagram-grid">
                <div *ngFor="let post of instagramPosts" class="insta-item" (click)="openInstagramPost(post.permalink)">
                    
                    <div *ngIf="post.media_type === 'VIDEO'" class="media-content">
                        <video controlsList="nodownload" muted>
                            <source [src]="post.media_url" type="video/mp4">
                        </video>
                        <div class="play-icon"><i class="pi pi-play"></i></div>
                    </div>

                    <div *ngIf="post.media_type === 'IMAGE' || post.media_type === 'CAROUSEL_ALBUM'" class="media-content">
                        <img [src]="post.media_url" alt="Instagram Post">
                    </div>

                </div>
            </div>

        </div>
    </div>

    <div class="blog-section">
        <div class="blog-container">
            <h2 class="section-title">ÚLTIMAS PUBLICAÇÕES</h2>
            <div class="header-line gold-line"></div>

            <div class="posts-grid">
                <div class="post-card" *ngFor="let post of paginatedPost" (click)="getPostBlogger(post.id)">
                    
                    <div class="post-image">
                        <img [src]="extractImageUrl(post.content)" alt="Post Cover" onerror="this.src='assets/placeholder.jpg'">
                    </div>

                    <div class="post-content">
                        <span class="post-date">
                            <i class="pi pi-calendar"></i> {{ formatDate(post.published) }}
                        </span>
                        
                        <h3 class="post-title">{{ extractTitle(post.title) }}</h3>
                        
                        <p class="post-excerpt" [innerHTML]="extractSummary(post.content)"></p>
                        
                        <div class="post-footer">
                            <span class="read-more">LER MAIS <i class="pi pi-arrow-right"></i></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pagination-controls">
                <button pButton pRipple icon="pi pi-angle-left" 
                        class="p-button-rounded p-button-outlined btn-nav"
                        (click)="prevPageBlog()" 
                        [disabled]="currentPage === 1"></button>
                
                <span class="page-number">Página {{ currentPage }}</span>

                <button pButton pRipple icon="pi pi-angle-right" 
                        class="p-button-rounded p-button-outlined btn-nav"
                        (click)="nextPageBlog()" 
                        [disabled]="(currentPage * postsPerPage) >= bloggerPosts.length"></button>
            </div>

        </div>
    </div>

</div>
