<nav class="luxury-navbar" [ngClass]="{'scrolled': isScrolled, 'page-interior': !isHomePage}">
  <div class="nav-container">

    <a routerLink="/" class="logo-link">
      <img src="assets/logo-nova.svg" alt="Waleska Silveira - Psicanalista" class="brand-logo">
    </a>

    <div class="desktop-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">HOME</a>
      <a routerLink="/sobre" routerLinkActive="active" class="nav-link">SOBRE</a>
      <a routerLink="/servicos" routerLinkActive="active" class="nav-link">SERVIÇOS</a>

      <!-- Dropdown Produtos -->
      <div class="nav-dropdown" (mouseenter)="productsDropdownOpen = true" (mouseleave)="productsDropdownOpen = false">
        <span class="nav-link dropdown-toggle" [class.active]="isProductsActive()">
          PRODUTOS <i class="pi pi-chevron-down dropdown-arrow" [class.rotated]="productsDropdownOpen"></i>
        </span>
        <div class="dropdown-menu" [class.show]="productsDropdownOpen">
          <a routerLink="/metodo-origem" class="dropdown-item" (click)="productsDropdownOpen = false">
            <div class="dropdown-item-header">
              <span class="item-title font-editorial">Método ORIGEM</span>
              <span class="item-badge-new">NOVO</span>
            </div>
            <span class="item-desc">Uma metodologia para voltar a si</span>
          </a>
          <div class="dropdown-divider"></div>
          <a routerLink="/mentoria" class="dropdown-item" (click)="productsDropdownOpen = false">
            <div class="dropdown-item-header">
              <span class="item-title font-editorial">Mentoria Liberta</span>
            </div>
            <span class="item-desc">Empoderamento e relações conscientes</span>
          </a>
        </div>
      </div>

      <a routerLink="/blog" routerLinkActive="active" class="nav-link">BLOG</a>
      <a routerLink="/contato" routerLinkActive="active" class="nav-link">CONTATO</a>

      <button class="nav-cta-btn" (click)="whatsapp()">
        AGENDAR SESSÃO
      </button>
    </div>

    <div class="mobile-trigger">
      <button (click)="sidebarVisible = true" class="mobile-toggle-btn" aria-label="Abrir Menu de Navegação">
        <i class="pi pi-bars"></i>
      </button>
    </div>

  </div>
</nav>

<p-sidebar [(visible)]="sidebarVisible" position="right" [baseZIndex]="10000" styleClass="luxury-sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-brand">
      <img src="assets/logo-nova.svg" alt="Waleska Silveira" class="sidebar-logo">
      <span class="sidebar-subtitle">PSICANALISTA CLÍNICA</span>
    </div>

    <div class="sidebar-links">
      <a routerLink="/" (click)="sidebarVisible = false" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}" class="sidebar-item">HOME</a>
      <a routerLink="/sobre" (click)="sidebarVisible = false" routerLinkActive="active" class="sidebar-item">SOBRE</a>
      <a routerLink="/servicos" (click)="sidebarVisible = false" routerLinkActive="active"
        class="sidebar-item">SERVIÇOS</a>

      <!-- Grupo de Produtos no Mobile -->
      <div class="sidebar-products-group">
        <span class="sidebar-group-label">PRODUTOS & JORNADAS</span>
        <a routerLink="/metodo-origem" (click)="sidebarVisible = false" routerLinkActive="active" class="sidebar-item sidebar-sub-item">
          <span>MÉTODO ORIGEM</span>
          <span class="sidebar-badge-new">NOVO</span>
        </a>
        <a routerLink="/mentoria" (click)="sidebarVisible = false" routerLinkActive="active" class="sidebar-item sidebar-sub-item">
          <span>MENTORIA LIBERTA</span>
        </a>
      </div>

      <a routerLink="/blog" (click)="sidebarVisible = false" routerLinkActive="active" class="sidebar-item">BLOG &
        ARTIGOS</a>
      <a routerLink="/contato" (click)="sidebarVisible = false" routerLinkActive="active"
        class="sidebar-item">CONTATO</a>
    </div>

    <div class="sidebar-action">
      <button class="sidebar-cta-btn" (click)="whatsapp(); sidebarVisible = false">
        <i class="pi pi-whatsapp"></i> AGENDAR SESSÃO
      </button>
      <div class="sidebar-social">
        <a href="https://www.instagram.com/waleskasilveirapsi" target="_blank" rel="noopener noreferrer">
          <i class="pi pi-instagram"></i> @waleskasilveirapsi
        </a>
      </div>
    </div>
  </div>
</p-sidebar>
